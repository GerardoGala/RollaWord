  <!-- 1) Top Count-Down Timer -->
  <!-- 1) Top Count-Down Timer (Unified Flex Row Layout) -->
  <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: calc(var(--cell-size) * 8 + 2px); margin: calc(var(--baseline) * 4) auto 0 auto; box-sizing: border-box;">
    <h1 id="game-title" class="h1" style="margin: 0; text-align: left; text-transform: uppercase;">ROLLACITY</h1>

<!-- 3) Unified Game Action Control Panels -->
<div id="action-container" style="width: 100%; max-width: calc(var(--cell-size) * 8 + 2px); margin: 10px auto;">
    
    <!-- 🚀 Startup Selection Row (Both buttons side-by-side) -->
    <div id="mode-selection-row" style="display: flex; gap: 8px; width: 100%; height: 45px;">
        <button id="start-btn" class="btn" style="flex: 1; height: 100%;" 
                onclick="window.isDailyChallengeMode = false; document.getElementById('game-title').textContent = 'FREE PLAY'; document.getElementById('mode-selection-row').style.display='none'; document.getElementById('done-btn-container').style.display='block'; loadGame().then(function(){ if(typeof startGameEngine === 'function') startGameEngine(); });">
            FREE PLAY
        </button>
        <button id="challenge-start-btn" class="btn" style="flex: 1; height: 100%;" 
                onclick="window.isDailyChallengeMode = true; document.getElementById('game-title').textContent = 'DAILY CHALLENGE'; document.getElementById('mode-selection-row').style.display='none'; document.getElementById('done-btn-container').style.display='block'; loadGame().then(function(){ if(typeof startChallengeEngine === 'function') startChallengeEngine(); });">
            CHALLENGE
        </button>
    </div>

    <!-- 🏁 Active Gameplay State Panel (Done Button) -->
    <div id="done-btn-container" style="display: none; width: 100%; height: 45px;">
        <button id="done-btn" class="btn" style="width: 100%; height: 100%;" 
                onclick="document.getElementById('game-title').textContent = 'ROLLACITY'; document.getElementById('done-btn-container').style.display='none'; document.getElementById('mode-selection-row').style.display='flex'; if(typeof clearTimeoutEngine === 'function') clearTimeoutEngine();">
            Done
        </button>
    </div>
    <br>
<!-- Main Row Container using traditional blocking -->
<div id="help-share-row" style="width: 100%; height: 45px;">
  
  <!-- Left Side: Allocates 49% width with a right margin for the gap -->
  <div style="width: calc(49% - 4px); float: left; height: 100%;">
    <button id="howTo-btn" class="btn" style="width: 100%; height: 100%;" onclick="window.location.href='howToCity.html';">
      ❓ How To Play
    </button>
  </div>
  
  <!-- Right Side: Allocates 33% width with a left margin for the gap -->
  <div style="width: calc(33% - 4px); float: right; height: 100%;">
    <button id="share-btn" class="" style="width: 100%; height: 100%;" onclick="shareToMessenger()" title="Share">
      SHARE
    </button>
  </div>
  
  <!-- Clears the floats to keep the rest of your page layout safe -->
  <div style="clear: both;"></div>
</div>

<!-- Script Block for Sharing -->
<script>
// Opens the phone/browser share sheet; falls back to copying the link.
async function shareToMessenger() {
  const url = window.location.href;
  if (navigator.share) {
    try {
      await navigator.share({ title: 'RollaCity', text: 'Come play RollaCity!', url: url });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // player closed the share sheet
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    alert('Link copied. Paste it into a message to share.');
  } catch (e) {
    window.prompt('Copy this link to share:', url);
  }
}
</script>
 
<!-- 4) Bottom Plain Text Formula Scoring Output Box -->

Press 'FREE PLAY' or 'DAILY CHALLENGE' to play

<!-- Game logic is loaded AFTER the page is painted (idle time), or immediately when the
     player touches a button. FILES run in this exact order, same as before. -->
<script>
(function () {
  var FILES = [
    "/rollacity/js/citygen.js",
    "/js/rollawordbonus.js",
    "/js/rollawordisland.js",
    "/js/rollaworddisplay.js",
    "/js/rollawordscoring.js",
    "/js/rollaworddictionary.js",
    "/js/rollawordadult.js",
    "/js/rollaword.js"
  ];
  var MODULE = "/js/rollawordleaderboard.js";   // Firestore leaderboard (ES module), loaded last
  var promise = null;

  window.loadGame = function () {
    if (promise) return promise;

    // The game files were written to run while the page loads. They may ask to be told when
    // the page is ready ("DOMContentLoaded" / "load"). That moment has already passed, so
    // while they load, call such handlers right away instead of never.
    var realDocAdd = document.addEventListener;
    var realWinAdd = window.addEventListener;
    document.addEventListener = function (type, fn, opts) {
      if (type === "DOMContentLoaded" && document.readyState !== "loading") {
        setTimeout(function () { try { fn.call(document, new Event(type)); } catch (e) { console.error(e); } }, 0);
      } else { realDocAdd.call(document, type, fn, opts); }
    };
    window.addEventListener = function (type, fn, opts) {
      if (type === "load" && document.readyState === "complete") {
        setTimeout(function () { try { fn.call(window, new Event(type)); } catch (e) { console.error(e); } }, 0);
      } else { realWinAdd.call(window, type, fn, opts); }
    };
    function restore() { document.addEventListener = realDocAdd; window.addEventListener = realWinAdd; }

    // Download all files at the same time, but run them in order (async = false).
    var loads = FILES.map(function (src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.async = false;
        s.onload = resolve;
        s.onerror = function () { reject(new Error("Could not load " + src)); };
        document.head.appendChild(s);
      });
    });

    promise = Promise.all(loads)
      // The leaderboard needs the Firebase servers. If they cannot be reached, the game must still play.
      .then(function () {
        return import(new URL(MODULE, document.baseURI).href).catch(function (e) { console.error("Leaderboard failed to load:", e); });
      })
      .then(restore, function (e) { restore(); promise = null; console.error("Game failed to load:", e); throw e; });
    return promise;
  };

  // Warm up: once the page has finished loading, fetch the game when the browser is idle.
  window.addEventListener("load", function () {
    (window.requestIdleCallback || function (f) { setTimeout(f, 200); })(function () { loadGame().catch(function () {}); });
  });
  // Or as soon as the player touches the controls.
  ["pointerdown", "touchstart", "mouseover", "focusin"].forEach(function (ev) {
    document.addEventListener(ev, function () { loadGame().catch(function () {}); }, { once: true, passive: true });
  });
})();
</script>
