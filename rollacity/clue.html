<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RollaCity Clue</title>
<link rel="stylesheet" href="js/leaflet/leaflet.css">
<style>
  :root { --blue: #006abc; --blue-dark: #004a85; --sea: #cfe3f2; --land: #efe9dc; --pin: #d62d20; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #222; background: #fff; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #ccc; }
  header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .04em; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--blue); border: 0; border-radius: 0; padding: 8px 16px; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--blue-dark); }
  #stage { position: relative; flex: 1 1 auto; min-height: 220px; background: var(--sea); }
  #map { position: absolute; inset: 0; background: var(--sea); }
  #labels { position: absolute; inset: 0; z-index: 450; pointer-events: none; overflow: hidden; }
  .lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 10px; line-height: 1.1; color: #4a4538; text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; }
  .lab.t { font-weight: 700; font-size: 12px; color: #00315c; }
  .lab.cap { transform: translate(0, -50%); font-weight: 700; font-size: 12px; color: #8a1a10; }
  .lab.capl { transform: translate(-100%, -50%); font-weight: 700; font-size: 12px; color: #8a1a10; }
  #zones { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; z-index: 500; pointer-events: none; }
  #zones span { position: absolute; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: #345; background: rgba(255,255,255,.75); padding: 1px 5px; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 600; background: var(--sea); padding: 16px; text-align: center; }
  footer { padding: 8px 12px; font-size: .85rem; line-height: 1.35; border-top: 1px solid #ccc; }
  footer .key { display: inline-block; width: 12px; height: 12px; vertical-align: -1px; margin-right: 4px; }
  footer .k-country { background: var(--blue); opacity: .6; }
  footer .k-pin { background: var(--pin); border-radius: 50%; }
  footer small { display: block; color: #666; margin-top: 3px; }
  .pin { position: relative; }
  .pin .dot { position: absolute; left: 6px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--pin); border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.6); }
  .pin .pulse { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--pin); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pin .pulse { animation: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">ROLLACITY CLUE</h1>
  <button id="close-btn" type="button">Close</button>
</header>

<div id="stage">
  <div id="map" aria-label="Map showing where the answer is"></div>
  <div id="labels"></div>
  <div id="zones"></div>
  <div id="msg">Sorry, the map could not be loaded. Please close this window and try again.</div>
</div>

<footer>
  <span id="caption"></span>
  <small>Map: Natural Earth (public domain) · Leaflet. The strip marks 15° time-zone bands (UTC offsets).</small>
</footer>

<script src="js/leaflet/leaflet.js"></script>
<script>
(function () {
  "use strict";

  // The page is given only a position (?lat=..&lon=..), never a name, so the address cannot give the answer away.
  // No (or invalid) position = Washington, D.C.
  var DEF = { lat: 38.91, lon: -77.04 };
  var ZONES = 4, ZONE_W = 15;               // the map shows 4 time zones = 60 degrees of longitude
  var NO_HIGHLIGHT = [[43.74, 7.42]];       // Monaco sits on the French border: pin only, do not shade France

  function fail() { document.getElementById("msg").style.display = "flex"; }

  // Close: inside the game's modal -> tell the game page; opened on its own -> go back to the game.
  document.getElementById("close-btn").addEventListener("click", function () {
    if (window.parent !== window) window.parent.postMessage("rollacity-close-clue", "*");
    else window.location.href = "index.html";
  });

  var qs = new URLSearchParams(window.location.search);
  var lat = parseFloat(qs.get("lat")), lon = parseFloat(qs.get("lon"));
  var usedDefault = !(isFinite(lat) && isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180);
  if (usedDefault) { lat = DEF.lat; lon = DEF.lon; }

  // names mode (from the solution page, after the game): ?names=1&w=WORD  -> the map is labelled so the player can learn
  var NAMES = qs.get("names") === "1" || qs.get("labels") === "1";
  var info = null;

  function parseCSV(text) {
    var out = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.length > 1 || row[0] !== "") out.push(row); row = []; }
      else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); out.push(row); }
    return out;
  }
  function lookup(csvText, word) {
    var rows = parseCSV(csvText), h = rows.shift();
    var iC = h.indexOf("Type for country"), iK = h.indexOf("Type for capital(s)"), iA = h.indexOf("Also accepted"),
        iN = h.indexOf("Country"), iCap = h.indexOf("Capital(s)"), iLa = h.indexOf("Latitude(s)"), iLo = h.indexOf("Longitude(s)");
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i], n = -1;
      if (r[iC] === word) n = 0;
      else if ((n = (r[iK] || "").split("; ").indexOf(word)) < 0 && (r[iA] || "").split("; ").indexOf(word) >= 0) n = 0;
      if (n >= 0) return { lat: parseFloat(r[iLa].split("; ")[n]), lon: parseFloat(r[iLo].split("; ")[n]),
                           country: r[iN].replace(/\s*\(.*$/, ""), capital: r[iCap].split("; ")[n] };
    }
    return null;
  }

  Promise.all([
    fetch("js/countries.json").then(function (r) { if (!r.ok) throw 0; return r.json(); }),
    NAMES ? fetch("js/city-data.csv").then(function (r) { if (!r.ok) throw 0; return r.text(); }) : null
  ]).then(function (res) {
    if (NAMES) {
      info = lookup(res[1], (qs.get("w") || "").toUpperCase());
      if (!info && !usedDefault && qs.get("country") && qs.get("capital"))        // not in the list? use the names that came with the position
        info = { lat: lat, lon: lon, country: qs.get("country"), capital: qs.get("capital") };
      if (info) { lat = info.lat; lon = info.lon; usedDefault = false; document.getElementById("title").textContent = "ROLLACITY MAP"; }
      else NAMES = false;                          // unknown word: behave like a plain clue
    }
    draw(res[0]);
  }).catch(fail);

  function inRing(x, y, ring) {
    var c = false;
    for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      var xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  function segDist(px, py, a, b) {
    var dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
    var t = L ? Math.max(0, Math.min(1, ((px - a[0]) * dx + (py - a[1]) * dy) / L)) : 0;
    return Math.hypot(px - a[0] - t * dx, py - a[1] - t * dy);
  }
  // which country is the point in? (a capital on the coast may fall a hair outside the simplified outline: allow 0.3 degrees)
  function countryAt(countries, x, y) {
    if (NO_HIGHLIGHT.some(function (p) { return Math.abs(p[0] - y) < .1 && Math.abs(p[1] - x) < .1; })) return null;
    var i, p, best = null, bd = 0.3;
    for (i = 0; i < countries.length; i++)
      for (p = 0; p < countries[i].p.length; p++) {
        var poly = countries[i].p[p];
        if (inRing(x, y, poly[0]) && !poly.slice(1).some(function (h) { return inRing(x, y, h); })) return i;
      }
    for (i = 0; i < countries.length; i++)
      for (p = 0; p < countries[i].p.length; p++) {
        var r = countries[i].p[p][0];
        for (var k = 0; k < r.length - 1; k++) { var d = segDist(x, y, r[k], r[k + 1]); if (d < bd) { bd = d; best = i; } }
      }
    return best;
  }

  function draw(countries) {
    var hi = countryAt(countries, lon, lat), highlighted = 0;

    // ---- window: 4 whole time zones, the target's zone second or third from the left ----
    var kz = Math.round(lon / ZONE_W);
    var z0 = lon >= kz * ZONE_W ? kz - 1 : kz - 2;
    var west = z0 * ZONE_W - ZONE_W / 2, east = west + ZONES * ZONE_W;

    var map = L.map("map", {
      zoomControl: false, attributionControl: false, dragging: false, touchZoom: false, scrollWheelZoom: false,
      doubleClickZoom: false, boxZoom: false, keyboard: false, tap: false, zoomSnap: 0, preferCanvas: true
    });
    var bandLayer = L.layerGroup().addTo(map), landLayer = L.layerGroup().addTo(map), hiLayer = L.layerGroup().addTo(map);

    for (var k = z0; k < z0 + ZONES; k++) {
      if (k % 2 === 0) L.rectangle([[-85, k * ZONE_W - ZONE_W / 2], [85, k * ZONE_W + ZONE_W / 2]], { stroke: false, fill: true, fillColor: "#000", fillOpacity: .06, interactive: false }).addTo(bandLayer);
    }

    // countries are drawn 3 times, shifted by 360 degrees, so the Pacific wraps correctly
    countries.forEach(function (c, ci) {
      var isTarget = ci === hi;
      c.p.forEach(function (poly) {
        var xs = poly[0].map(function (p) { return p[0]; });
        var mn = Math.min.apply(null, xs), mx = Math.max.apply(null, xs);
        [-360, 0, 360].forEach(function (off) {
          if (mx + off < west - 1 || mn + off > east + 1) return;       // not in view
          var rings = poly.map(function (r) { return r.map(function (p) { return [p[1], p[0] + off]; }); });
          if (isTarget) {
            L.polygon(rings, { color: "#004a85", weight: 1.5, fillColor: "#006abc", fillOpacity: .6, interactive: false }).addTo(hiLayer);
            highlighted++;
          } else {
            L.polygon(rings, { color: "#a89f88", weight: .7, fillColor: "#efe9dc", fillOpacity: 1, interactive: false }).addTo(landLayer);
          }
        });
      });
    });

    L.marker([lat, lon], {
      interactive: false, keyboard: false,
      icon: L.divIcon({ className: "pin", html: '<span class="pulse"></span><span class="dot"></span>', iconSize: [26, 26], iconAnchor: [13, 13] })
    }).addTo(map);

    // ---- names mode: country names (largest part of each country) + the capital's name ----
    var cands = [];
    if (NAMES) {
      countries.forEach(function (c, ci) {
        var best = null, ba = -1;
        c.p.forEach(function (poly) {
          var r = poly[0], a = 0, cx = 0, cy = 0, mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
          for (var i = 0, j = r.length - 1; i < r.length; j = i++) {
            var f = r[j][0] * r[i][1] - r[i][0] * r[j][1];
            a += f; cx += (r[j][0] + r[i][0]) * f; cy += (r[j][1] + r[i][1]) * f;
            mnx = Math.min(mnx, r[i][0]); mxx = Math.max(mxx, r[i][0]); mny = Math.min(mny, r[i][1]); mxy = Math.max(mxy, r[i][1]);
          }
          var area = Math.abs(a) / 2;
          if (area > ba) { ba = area; best = { x: a ? cx / (3 * a) : (mnx + mxx) / 2, y: a ? cy / (3 * a) : (mny + mxy) / 2, w: mxx - mnx }; }
        });
        if (best) cands.push({ text: ci === hi && info ? info.country : c.n, x: best.x, y: best.y, w: best.w, target: ci === hi });
      });
      if (hi === null && info) cands.push({ text: info.country, x: lon, y: lat + 1.5, w: 0, target: true });   // tiny country: no outline to label
      cands.sort(function (a, b) { return (b.target ? 1e6 : 0) + b.w - ((a.target ? 1e6 : 0) + a.w); });
    }
    var labelBox = document.getElementById("labels");
    function placeLabels(w, h) {
      labelBox.innerHTML = "";
      if (!NAMES) return;
      var placed = [];
      function free(r) { return placed.every(function (q) { return r.r < q.l || r.l > q.r || r.b < q.t || r.t > q.b; }); }
      function add(text, px, py, cls, mode, forced) {
        var el = document.createElement("div");
        el.className = "lab " + cls; el.textContent = text;
        el.style.left = px + "px"; el.style.top = py + "px";
        labelBox.appendChild(el);
        var bw = el.offsetWidth, bh = el.offsetHeight;
        var l = mode === "l" ? px - bw : mode === "r" ? px : px - bw / 2;
        var rect = { l: l - 2, r: l + bw + 2, t: py - bh / 2 - 1, b: py + bh / 2 + 1 };
        if (rect.l < 0 || rect.r > w || rect.t < 0 || rect.b > h || (!forced && !free(rect))) { labelBox.removeChild(el); return false; }
        placed.push(rect); return true;
      }
      var pp = map.latLngToContainerPoint([lat, lon]);
      var left = pp.x > w * 0.62;
      if (info) add(info.capital, pp.x + (left ? -16 : 16), pp.y, left ? "capl" : "cap", left ? "l" : "r", true);
      cands.forEach(function (c) {
        [-360, 0, 360].forEach(function (off) {
          var X = c.x + off;
          if (X < west + 1 || X > east - 1) return;
          var p = map.latLngToContainerPoint([c.y, X]);
          if (!c.target && c.w * w / (ZONES * ZONE_W) < c.text.length * 4.6) return;     // too small to hold its name
          if (!c.target) { add(c.text, p.x, p.y, "", "c", false); return; }
          // the country's own name: keep it clear of the capital's name (small countries) by trying a few spots
          var tries = [[0, 0], [0, -24], [0, 24], [0, -42], [0, 42]], ok = false;
          for (var t = 0; t < tries.length && !ok; t++) ok = add(c.text, p.x + tries[t][0], p.y + tries[t][1], "t", "c", false);
          if (!ok) add(c.text, p.x, p.y - 24, "t", "c", true);
        });
      });
    }

    // ---- sizing: 60 degrees of longitude always fill the width; zoom and panning are locked ----
    var zoneBox = document.getElementById("zones");
    function fit() {
      map.invalidateSize(false);
      var w = document.getElementById("map").clientWidth || 360;
      var z = Math.log2(w / 256 * 360 / (ZONES * ZONE_W));
      map.setMinZoom(z); map.setMaxZoom(z);
      map.setView([lat, west + (ZONES * ZONE_W) / 2], z, { animate: false });
      placeLabels(document.getElementById("map").clientWidth, document.getElementById("map").clientHeight);
      zoneBox.innerHTML = "";
      for (var k = z0; k < z0 + ZONES; k++) {
        var x = map.latLngToContainerPoint([lat, k * ZONE_W]).x;
        var s = document.createElement("span");
        var off = ((k + 12) % 24 + 24) % 24 - 12; if (off === -12) off = 12;
        s.textContent = "UTC" + (off > 0 ? "+" + off : off < 0 ? "−" + Math.abs(off) : "±0");
        s.style.left = x + "px"; s.style.bottom = "2px";
        zoneBox.appendChild(s);
      }
    }
    fit();
    window.addEventListener("resize", fit);

    var span = function (cls) { return '<span class="key ' + cls + '"></span>'; };
    document.getElementById("caption").innerHTML =
      (highlighted ? span("k-country") + "Blue area: the country. " : "") + span("k-pin") + "Red pin: the capital city." +
      (!highlighted ? " (A tiny country: look for the pin.)" : "") +
      (usedDefault ? " Example clue (no position was given): Washington, D.C." : "") +
      (NAMES && info ? " " + info.capital + ", " + info.country + "." : "");
  }
})();
</script>
</body>
</html>
