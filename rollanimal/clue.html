<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>RollAnimal Clue</title>
<style>
  :root { --blue: #006abc; --blue-dark: #004a85; --bg: #e9eef2; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #222; background: #fff; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #ccc; }
  header h1 { font-size: 1.1rem; margin: 0; letter-spacing: .04em; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--blue); border: 0; border-radius: 0; padding: 8px 16px; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--blue-dark); }
  #stage { position: relative; flex: 1 1 auto; min-height: 220px; background: var(--bg); }
  #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; text-align: center; background: var(--bg); line-height: 1.4; }
  footer { padding: 8px 12px; font-size: .85rem; line-height: 1.35; border-top: 1px solid #ccc; }
  footer small { display: block; color: #666; margin-top: 3px; overflow-wrap: anywhere; }
  footer a { color: var(--blue); }
</style>
</head>
<body>
<header>
  <h1 id="title">ROLLANIMAL CLUE</h1>
  <button id="close-btn" type="button">Close</button>
</header>

<div id="stage">
  <img id="photo" alt="A photo of an animal">
  <div id="msg"></div>
</div>

<footer>
  <span id="caption"></span>
  <small id="credit"></small>
</footer>

<script>
(function () {
  "use strict";

  // The page is given only a row number (?r=..), never a name, so the address cannot give the answer away.
  // No (or invalid) row = the first animal in animal-data.csv.

  var photo = document.getElementById("photo"), msg = document.getElementById("msg");
  var caption = document.getElementById("caption"), credit = document.getElementById("credit");

  // Close: inside the game's modal -> tell the game page; opened on its own -> go back to the game.
  document.getElementById("close-btn").addEventListener("click", function () {
    if (window.parent !== window) window.parent.postMessage("rollanimal-close-clue", "*");
    else window.location.href = "index.html";
  });

  var qs = new URLSearchParams(window.location.search);
  var r = parseInt(qs.get("r"), 10);

  // names mode (from the solution page, after the game): ?names=1&w=WORD  -> the animal is named so the player can learn
  var NAMES = qs.get("names") === "1" || qs.get("labels") === "1";

  function parseCSV(text) {
    var out = [], row = [], cell = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
      else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cell); cell = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.length > 1 || row[0] !== "") out.push(row); row = []; }
      else cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); out.push(row); }
    return out;
  }

  function showMessage(text) { photo.style.display = "none"; msg.textContent = text; msg.style.display = "flex"; }

  // The credit holds the photo's web address, and the file name in it usually names the animal.
  // So during the game (full = false) only the author and licence are shown, plus a link to the credits page.
  // After the game (names mode, full = true) the whole credit is shown, with its web address as a link.
  function fillCredit(text, full) {
    credit.textContent = "";
    if (!text) return;
    credit.appendChild(document.createTextNode("Photo: "));
    if (!full) {
      credit.appendChild(document.createTextNode(text.replace(/\s*https?:\/\/\S+/g, "").replace(/[,\s]+$/, "") + " · "));
      var all = document.createElement("a");
      all.href = "credits.html"; all.textContent = "All photo credits"; all.target = "_blank"; all.rel = "noopener";
      credit.appendChild(all);
      return;
    }
    text.split(/(https?:\/\/\S+)/).forEach(function (part) {
      if (/^https?:\/\//.test(part)) {
        var a = document.createElement("a");
        a.href = part; a.textContent = part; a.target = "_blank"; a.rel = "noopener noreferrer";
        credit.appendChild(a);
      } else if (part) credit.appendChild(document.createTextNode(part));
    });
  }

  function article(group) { return /^[aeiou]/i.test(group) ? "an " : "a "; }

  fetch("js/animal-data.csv").then(function (res) { if (!res.ok) throw 0; return res.text(); }).then(function (text) {
    var rows = parseCSV(text), h = rows.shift();
    var col = function (n) { return h.indexOf(n); };
    var iA = col("Animal"), iG = col("Group"), iT = col("Type"), iAlso = col("Also accepted"),
        iF = col("Fact"), iI = col("Image"), iC = col("Credit");
    var row = null, usedFirst = false;

    if (NAMES) {                                    // look the animal up by its word
      var w = (qs.get("w") || "").toUpperCase();
      for (var i = 0; i < rows.length && !row; i++)
        if (rows[i][iT] === w || (rows[i][iAlso] || "").split("; ").indexOf(w) >= 0) row = rows[i];
      if (!row) NAMES = false;                      // unknown word: behave like a plain clue
    }
    if (!row && r >= 1 && r <= rows.length) row = rows[r - 1];
    if (!row) {                                     // no (or invalid) row given: show the first animal in the list
      row = rows[0];
      usedFirst = true;
    }

    var group = (row[iG] || "").toLowerCase();
    var hint = group ? "Hint: this animal is " + article(group) + group.replace(/^invertebrate$/, "invertebrate (no backbone)") + "." : "";

    if (NAMES) {
      document.getElementById("title").textContent = "ROLLANIMAL PHOTO";
      photo.alt = row[iA];
      caption.textContent = row[iA] + (group ? " (" + group + "). " : ". ") + (row[iF] || "");
    } else {
      caption.textContent = "Which animal is this? " + hint + (usedFirst ? " (Example clue: no animal was given.)" : "");
    }
    fillCredit(row[iC], NAMES);

    var src = (row[iI] || "").trim();
    if (!src) { showMessage("The photo for this animal is not ready yet. " + hint); return; }
    photo.onerror = function () { showMessage("Sorry, the photo could not be loaded. " + hint); };
    photo.onload = function () { msg.style.display = "none"; photo.style.display = "block"; };
    photo.src = src;
  }).catch(function () { showMessage("Sorry, the clue could not be loaded. Please close this window and try again."); });
})();
</script>
</body>
</html>
