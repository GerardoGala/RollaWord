<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RollAnimal - Solution</title>
  <style>
    :root { --blue: #006abc; --ink: #1a1a1a; --line: #d9d9d9; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; color: var(--ink); background: #fff; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { color: var(--blue); font-size: 2rem; margin: 8px 0 4px; }
    .sub { color: #555; margin: 0 0 16px; line-height: 1.4; }

    #solution-grid { display: grid; grid-template-columns: repeat(8, 1fr); border: 1px solid var(--line); min-height: 40px; }
    .cell { aspect-ratio: 1; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
    .tile { width: 92%; height: 92%; border-radius: 4px; background: var(--blue); color: #fff;
            font-weight: 700; font-size: clamp(1.1rem, 6.5vw, 2rem); display: flex; align-items: center; justify-content: center; }
    .tile.hl { background: #004a85; box-shadow: 0 0 0 3px #f5b400; }

    #status { background: #f2f2f2; border-left: 6px solid var(--blue); padding: 12px 16px; line-height: 1.5; margin: 12px 0 0; }
    h2 { font-size: 1.1rem; margin: 20px 0 8px; }
    #words { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
    #words li { margin: 0; }
    #words button { background: #eef5fb; color: var(--blue); font-weight: 700; font-size: 1rem; padding: 8px 14px; border: 2px solid transparent;
                    border-radius: 16px; letter-spacing: .05em; cursor: pointer; }
    #words button.active { border-color: var(--blue); }
    .hint { color: #555; font-size: .9rem; margin: 0 0 8px; }
    .credit { color: #777; font-size: .8rem; margin: 20px 0 0; line-height: 1.4; }
    .credit a { color: var(--blue); }

    #back { display: block; width: 100%; margin-top: 24px; padding: 16px; font-size: 1.2rem; font-weight: 700;
            color: #fff; background: var(--blue); border: 0; cursor: pointer; }
    #back:active { filter: brightness(.9); }

    /* Pop-up with the animal's photo */
    #pop { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 12px; }
    #pop.open { display: flex; }
    #pop .card { background: #fff; width: 100%; max-width: 480px; max-height: 100%; overflow: auto; position: relative; border-radius: 6px; }
    #pop .photo { background: #e9eef2; min-height: 160px; display: flex; align-items: center; justify-content: center; color: #666; text-align: center; padding: 8px; }
    #pop .photo img { display: block; width: 100%; max-height: 55vh; object-fit: contain; }
    #pop .info { padding: 12px 16px 16px; line-height: 1.45; }
    #pop h3 { margin: 0; color: var(--blue); font-size: 1.4rem; }
    #pop .group { color: #555; margin: 2px 0 8px; font-size: .95rem; }
    #pop p { margin: 6px 0 0; }
    #pop p.source { font-size: .8rem; color: #666; overflow-wrap: anywhere; }
    #pop p.source a { color: var(--blue); }
    #pop-close { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; font-size: 1.5rem; line-height: 1; color: #fff;
                 background: rgba(0,0,0,.6); border: 0; border-radius: 50%; cursor: pointer; }
    #pop-close:hover, #pop-close:focus-visible { background: var(--blue); }
  </style>
</head>
<body>
  <main>
    <h1>Solution</h1>
    <p class="sub">One possible way to play all 8 tiles.</p>

    <div id="solution-grid"></div>
    <p id="status" hidden></p>

    <div id="word-section" hidden>
      <h2>Words in this solution</h2>
      <p class="hint">Tap a word to see the animal.</p>
      <ul id="words"></ul>
    </div>

    <p class="credit" id="credit" hidden>
      Animal photos come from <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a>.
      See all <a href="credits.html">photo credits</a>.
    </p>
    <button id="back" type="button">Back to Game</button>

  </main>
  <hr>
<footer style="
  max-width: calc(var(--cell-size) * 8 + 2px);
  margin: calc(var(--baseline) * 8) auto calc(var(--baseline) * 6);
  padding-top: calc(var(--baseline) * 4);
  border-top: 1px solid var(--light);
  text-align: center;
  font-size: 0.85rem;
  color: var(--gray);
">
  <nav style="display: flex; justify-content: center; gap: 1.25rem; flex-wrap: wrap; margin-bottom: 0.5rem;">
    <a href="/toc.html" style="color: var(--color); text-decoration: none; font-weight: 500;">T&C</a>
    <a href="/about.html" style="color: var(--color); text-decoration: none; font-weight: 500;">About</a>
    <a href="/privacy.html" style="color: var(--color); text-decoration: none; font-weight: 500;">Privacy</a>
    <a href="/contact.html" style="color: var(--color); text-decoration: none; font-weight: 500;">Contact</a>
  </nav>
  <div>© 2026 RollAnimal</div>
</footer>

  <!-- The pop-up: opens when a word is tapped -->
  <div id="pop" role="dialog" aria-modal="true" aria-labelledby="pop-name">
    <div class="card">
      <button id="pop-close" type="button" aria-label="Close">&times;</button>
      <div class="photo" id="pop-photo"></div>
      <div class="info">
        <h3 id="pop-name"></h3>
        <p class="group" id="pop-group"></p>
        <p id="pop-fact"></p>
        <p class="source" id="pop-credit"></p>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";

    // The game saves the solution of the board it just dealt under this key (animalgen.js, and rollaword.js for the Daily Challenge).
    var STORE_KEY = "rollanimal.solution";
    var DATA_URL = "js/animal-data.csv";

    var $ = function (id) { return document.getElementById(id); };
    var solution = null, animals = {}, lastFocus = null;

    // ---- the saved solution ----
    function loadSolution() {
      var raw = null;
      try { raw = localStorage.getItem(STORE_KEY) || sessionStorage.getItem(STORE_KEY); } catch (e) { /* storage blocked */ }
      if (!raw) return null;
      try {
        var s = JSON.parse(raw);
        return s && Array.isArray(s.rows) && Array.isArray(s.words) ? s : null;
      } catch (e) { return null; }
    }

    // ---- the board ----
    function drawGrid() {
      var grid = $("solution-grid");
      grid.textContent = "";
      var rows = solution.rows.filter(function (r) { return /[^.]/.test(r); });      // leave out rows with no tiles
      var offset = solution.rows.findIndex(function (r) { return /[^.]/.test(r); });
      rows.forEach(function (line, r) {
        for (var c = 0; c < 8; c++) {
          var cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.r = String(r + offset); cell.dataset.c = String(c);
          var ch = line.charAt(c);
          if (ch && ch !== ".") {
            var t = document.createElement("div");
            t.className = "tile"; t.textContent = ch;
            cell.appendChild(t);
          }
          grid.appendChild(cell);
        }
      });
    }
    function highlight(w) {
      document.querySelectorAll(".tile.hl").forEach(function (t) { t.classList.remove("hl"); });
      if (!w) return;
      for (var i = 0; i < w.word.length; i++) {
        var r = w.row + (w.dir === "V" ? i : 0), c = w.col + (w.dir === "H" ? i : 0);
        var cell = document.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"] .tile');
        if (cell) cell.classList.add("hl");
      }
    }

    // ---- the words ----
    function drawWords() {
      var list = $("words"), seen = {};
      list.textContent = "";
      solution.words.forEach(function (w) {
        if (seen[w.word]) return; seen[w.word] = true;
        var li = document.createElement("li"), b = document.createElement("button");
        b.type = "button"; b.textContent = w.word;
        b.addEventListener("click", function () {
          list.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
          b.classList.add("active");
          highlight(w);
          openPop(w.word, b);
        });
        li.appendChild(b); list.appendChild(li);
      });
      $("word-section").hidden = false; $("credit").hidden = false;
    }

    // ---- the data file ----
    function parseCSV(text) {
      var out = [], row = [], cell = "", q = false;
      for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
        else if (ch === '"') q = true;
        else if (ch === ",") { row.push(cell); cell = ""; }
        else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.length > 1 || row[0] !== "") out.push(row); row = []; }
        else cell += ch;
      }
      if (cell !== "" || row.length) { row.push(cell); out.push(row); }
      return out;
    }
    function loadAnimals() {
      return fetch(DATA_URL).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (text) {
        var rows = parseCSV(text.replace(/^﻿/, "")), h = rows.shift();
        var col = function (n) { return h.indexOf(n); };
        var iA = col("Animal"), iG = col("Group"), iT = col("Type"), iAlso = col("Also accepted"), iF = col("Fact"), iI = col("Image"), iC = col("Credit");
        rows.forEach(function (r) {
          var a = { name: r[iA], group: r[iG] || "", fact: r[iF] || "", image: (r[iI] || "").trim(), credit: r[iC] || "" };
          animals[r[iT]] = a;                                                       // the word as typed on the board
          (r[iAlso] || "").split("; ").forEach(function (w) { if (w) animals[w] = a; });   // other accepted names
        });
      });
    }

    // ---- the pop-up ----
    function fillCredit(el, text) {
      el.textContent = "";
      if (!text) return;
      el.appendChild(document.createTextNode("Photo: "));
      text.split(/(https?:\/\/\S+)/).forEach(function (part) {
        if (/^https?:\/\//.test(part)) {
          var a = document.createElement("a");
          a.href = part; a.textContent = "source"; a.target = "_blank"; a.rel = "noopener noreferrer";
          el.appendChild(a);
        } else if (part) el.appendChild(document.createTextNode(part));
      });
    }
    function openPop(word, opener) {
      var a = animals[word], photo = $("pop-photo");
      lastFocus = opener || null;
      photo.textContent = "";
      if (!a) {
        $("pop-name").textContent = word; $("pop-group").textContent = ""; $("pop-fact").textContent = "";
        $("pop-credit").textContent = "";
        photo.textContent = "Sorry, this animal could not be found in the list.";
      } else {
        $("pop-name").textContent = a.name;
        $("pop-group").textContent = a.group;
        $("pop-fact").textContent = a.fact;
        fillCredit($("pop-credit"), a.image ? a.credit : "");
        if (a.image) {
          var img = document.createElement("img");
          img.alt = "Photo of " + a.name;
          img.onerror = function () { photo.textContent = "Sorry, the photo could not be loaded."; };
          photo.textContent = "Loading the photo…";
          img.onload = function () { photo.textContent = ""; photo.appendChild(img); };
          img.src = a.image;
        } else photo.textContent = "The photo for this animal is not ready yet.";
      }
      $("pop").classList.add("open");
      $("pop-close").focus();
    }
    function closePop() {
      $("pop").classList.remove("open");
      $("pop-photo").textContent = "";                    // stop loading a photo nobody is looking at
      if (lastFocus) lastFocus.focus();
    }
    $("pop-close").addEventListener("click", closePop);
    $("pop").addEventListener("click", function (e) { if (e.target === this) closePop(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("pop").classList.contains("open")) closePop(); });

    // ---- Back to Game ----
    $("back").addEventListener("click", function () {
      var sameSite = document.referrer && document.referrer.indexOf(location.origin) === 0;
      if (sameSite && history.length > 1) history.back(); else location.href = "index.html";
    });

    // ---- start ----
    solution = loadSolution();
    if (!solution) {
      $("status").hidden = false;
      $("status").textContent = "There is no solution to show yet. Play a game, then press “Show me the Solution” when it ends.";
    } else {
      drawGrid();
      loadAnimals().then(drawWords).catch(function () {
        drawWords();                                      // the board and words still show; only the photos are missing
        $("status").hidden = false;
        $("status").textContent = "The animal photos could not be loaded right now.";
      });
    }
  })();
  </script>
</body>
</html>
