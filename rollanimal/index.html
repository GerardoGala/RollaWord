<div id="action-container" style="width: 100%; max-width: calc(var(--cell-size) * 8 + 2px); margin: 10px auto;">

    <!-- 🚀 Startup Selection Row (Both buttons side-by-side) -->
    <div id="mode-selection-row" style="display: flex; gap: 8px; width: 100%; height: 45px;">

                onclick="document.getElementById('game-title').textContent = 'ROLLANIMAL'; document.getElementById('done-btn-container').style.display='none'; document.getElementById('mode-selection-row').style.display='flex'; if(typeof clearTimeoutEngine === 'function') clearTimeoutEngine();">
            Done
        </button>
    </div>
    <br>
<!-- Main Row Container using traditional blocking -->

      Clue?
    </button>
  </div>

  <div style="flex: 1 1 0; min-width: 0; height: 100%;">
    <button id="share-btn" class="" style="width: 100%; height: 100%; padding: 0 4px; text-align: center; white-space: nowrap;" onclick="shareToMessenger()" title="Share">

<!-- Clue? modal: clue.html is shown in a full-screen overlay on top of the game -->
<div id="clue-modal" role="dialog" aria-modal="true" aria-label="Clue photo" style="display:none; position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.55); align-items:center; justify-content:center;">
  <iframe id="clue-frame" title="Clue photo" style="border:0; background:#fff; width:100%; max-width:480px; height:100%; max-height:760px;"></iframe>
</div>

<!-- Script Block for the Clue? button -->
<script>
// Clue? passes only a row number (?r=) to clue.html, never a name, so the address cannot give the answer away.
// clue.html looks that row up in js/animal-data.csv and shows its Image and Credit.
// No board yet (or no row found) = no parameter, and clue.html shows a default animal.
function clueCsv(text) {
  var out = [], row = [], cell = "", q = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); cell = ""; if (row.length > 1 || row[0] !== "") out.push(row); row = []; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); out.push(row); }
  return out;
}
async function clueWord() {
  var daily = (typeof isDailyChallengeMode !== 'undefined') && isDailyChallengeMode;
  if (daily) {
    var d = new Date();
    var key = String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    var data = await (await fetch('/js/animalsolutions.json')).json();
    return (data[key] && data[key].term) || '';
  }
  return (window.lastAnimalSolution && window.lastAnimalSolution.term) || '';
}
async function clueRow(word) {
  if (!word) return 0;
  var rows = clueCsv(await (await fetch('js/animal-data.csv')).text()), h = rows.shift();
  var iT = h.indexOf('Type'), iA = h.indexOf('Also accepted');
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r[iT] === word || (r[iA] || '').split('; ').indexOf(word) >= 0) return i + 1;   // 1 = first animal row
  }
  return 0;
}
async function openClue() {
  var qs = '';
  try {
    var n = await clueRow(await clueWord());
    if (n) qs = '?r=' + n;
  } catch (e) { qs = ''; }
  document.getElementById('clue-frame').src = 'clue.html' + qs;
  document.getElementById('clue-modal').style.display = 'flex';
}
function closeClue() {
  document.getElementById('clue-modal').style.display = 'none';
  document.getElementById('clue-frame').src = 'about:blank';
}
window.addEventListener('message', function (e) { if (e.origin === window.location.origin && e.data === 'rollanimal-close-clue') closeClue(); });
document.getElementById('clue-modal').addEventListener('click', function (e) { if (e.target === this) closeClue(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeClue(); });
</script>

<!-- Script Block for Sharing -->
<script>
// Opens the phone/browser share sheet; falls back to copying the link.
async function shareToMessenger() {
  const url = window.location.href;
  if (navigator.share) {
    try {
      await navigator.share({ title: 'RollAnimal', text: 'Come play RollAnimal!', url: url });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // player closed the share sheet
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    alert('Link copied. Paste it into a message to share.');
  } catch (e) {
    window.prompt('Copy this link to share:', url);
  }
}
</script>

<!-- Game logic is loaded AFTER the page is painted (idle time), or immediately when the
     player touches a button. FILES run in this exact order, same as before. -->
<script>
(function () {
  var FILES = [
    "/rollanimal/js/animalgen.js",
    "/js/rollawordbonus.js",
    "/js/rollawordisland.js",
    "/js/rollaworddisplay.js",
    "/js/rollawordscoring.js",
    "/js/rollaworddictionary.js",
    "/js/rollawordadult.js",
    "/js/rollaword.js"
  ];
  var MODULE = "/js/rollawordleaderboard.js";   // Firestore leaderboard (ES module), loaded last
  var promise = null;

  window.loadGame = function () {
    if (promise) return promise;

    // The game files were written to run while the page loads. They may ask to be told when
    // the page is ready ("DOMContentLoaded" / "load"). That moment has already passed, so
    // while they load, call such handlers right away instead of never.
    var realDocAdd = document.addEventListener;
    var realWinAdd = window.addEventListener;
    document.addEventListener = function (type, fn, opts) {
      if (type === "DOMContentLoaded" && document.readyState !== "loading") {
        setTimeout(function () { try { fn.call(document, new Event(type)); } catch (e) { console.error(e); } }, 0);
      } else { realDocAdd.call(document, type, fn, opts); }
    };
    window.addEventListener = function (type, fn, opts) {
      if (type === "load" && document.readyState === "complete") {
        setTimeout(function () { try { fn.call(window, new Event(type)); } catch (e) { console.error(e); } }, 0);
      } else { realWinAdd.call(window, type, fn, opts); }
    };
    function restore() { document.addEventListener = realDocAdd; window.addEventListener = realWinAdd; }

    // Download all files at the same time, but run them in order (async = false).
    var loads = FILES.map(function (src) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = src;
        s.async = false;
        s.onload = resolve;
        s.onerror = function () { reject(new Error("Could not load " + src)); };
        document.head.appendChild(s);
      });
    });

    promise = Promise.all(loads)
      // The leaderboard needs the Firebase servers. If they cannot be reached, the game must still play.
      .then(function () {
        return import(new URL(MODULE, document.baseURI).href).catch(function (e) { console.error("Leaderboard failed to load:", e); });
      })
      .then(restore, function (e) { restore(); promise = null; console.error("Game failed to load:", e); throw e; });
    return promise;
  };

  // Warm up: once the page has finished loading, fetch the game when the browser is idle.
  window.addEventListener("load", function () {
    (window.requestIdleCallback || function (f) { setTimeout(f, 200); })(function () { loadGame().catch(function () {}); });
  });
  // Or as soon as the player touches the controls.
  ["pointerdown", "touchstart", "mouseover", "focusin"].forEach(function (ev) {
    document.addEventListener(ev, function () { loadGame().catch(function () {}); }, { once: true, passive: true });
  });
})();
</script>
