<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Challenge Leaderboard – RollaWord</title>
    <meta name="description" content="See today’s top 10 scores in the RollaWord Daily Challenge and browse previous days’ leaderboards. Free online word game.">
    <meta name="robots" content="index, follow">
   <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5517653304280747" crossorigin="anonymous"></script>
    <link rel="canonical" href="https://www.rollaword.com/leaderboard.html">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --baseline: 8px;
            --gray: #666;
            --primary: #0066cc;
            --background: #ffffff;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --warning-color: #cc0000;
        }
        body {
            font-family: var(--font-stack);
            margin: 0;
            padding: calc(var(--baseline) * 3);
            background-color: var(--background);
            color: #333;
        }
        .leaderboard-container {
            width: 100%;
            max-width: calc(var(--cell-size, 45px) * 8 + 2px);
            margin: 0 auto;
            padding: 0 1ch;
            box-sizing: border-box;
        }
        .leaderboard-row {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: calc(var(--baseline) * 3.5) calc(var(--baseline) * 4);
            border-bottom: 1px solid var(--light);
            font-family: Menlo, Monaco, Consolas, monospace;
        }
        .leaderboard-row:hover {
            background-color: var(--lighter);
        }
        .rank-badge {
            font-variation-settings: "wght" var(--font-weight-bold);
            min-width: 4ch;
            color: var(--color);
        }
        .player-name {
            flex-grow: 1;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-color);
        }
        .player-score {
            font-variation-settings: "wght" var(--font-weight-bold);
            color: var(--success-color);
            padding-left: 1ch;
        }

        /* Modern inline layout design for the added date controllers */
        .date-nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: calc(var(--baseline) * 3);
            gap: 1ch;
        }
        .nav-arrow-btn {
            background-color: var(--light, #f1f1f1);
            color: var(--text-color, #333);
            border: 1px solid var(--light, #ccc);
            border-radius: var(--border-radius, 4px);
            padding: 0.5ch 2ch;
            font-size: 0.85rem;
            cursor: pointer;
            font-variation-settings: "wght" var(--font-weight-bold);
            transition: opacity 0.2s ease;
        }
        .nav-arrow-btn:hover:not(:disabled) {
            background-color: var(--lighter, #e1e1e1);
        }
        .nav-arrow-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <header class="leaderboard-container" style="margin-top: calc(var(--baseline) * 10); text-align: center;">
        <h1 class="h1" style="margin-top: 0; letter-spacing: 0.05em;">LEADERBOARD</h1>
        
        <!-- Updated to host functional semantic wrapper blocks inside your text region -->
        <div class="date-nav-wrapper">
            <button id="prev-date-btn" class="nav-arrow-btn">◀ PREV</button>
            <p style="margin: 0; font-size: 0.9rem; color: var(--gray); text-transform: uppercase; letter-spacing: 0.1em;">
                Daily Challenge: <span id="current-date-display">--------</span>
            </p>
            <button id="next-date-btn" class="nav-arrow-btn" disabled>NEXT ▶</button>
        </div>
    </header>

    <hr class="separator--dot" style="margin-top: calc(var(--baseline) * 4); margin-bottom: calc(var(--baseline) * 4);">

    <!-- Main Rankings Table Area -->
    <main class="leaderboard-container">
        <div id="leaderboard-table-wrapper" class="table-striped" style="border: 1px solid var(--light); border-radius: var(--border-radius); overflow: hidden;">
            <div id="leaderboard-loading" style="text-align: center; padding: calc(var(--baseline) * 10); color: var(--gray); font-style: italic;">
                Loading the scores...
            </div>
        </div>
    </main>

    <!-- Structural spacer line mirroring game board boundaries -->
    <div id="board-separator" style="margin-top: calc(var(--baseline) * 8);"></div>

    <!-- Navigation Control Row -->
    <footer class="leaderboard-container" style="margin-bottom: calc(var(--baseline) * 10);">
        <button class="btn" style="width: 100%; height: 45px; justify-content: center;" onclick="window.location.href='rollaWord.html'">
            RETURN TO GAME
        </button>
    </footer>

    <footer style="
    max-width: calc(var(--cell-size) * 8 + 2px);
    margin: calc(var(--baseline) * 8) auto calc(var(--baseline) * 6);
    padding-top: calc(var(--baseline) * 4);
    border-top: 1px solid var(--light);
    text-align: center;
    font-size: 0.85rem;
    color: var(--gray);
    ">
    <nav style="display: flex; justify-content: center; gap: 1.25rem; flex-wrap: wrap; margin-bottom: 0.5rem;">
        <a href="/about.html" style="color: var(--color); text-decoration: none; font-weight: 500;">About</a>
        <a href="/privacy.html" style="color: var(--color); text-decoration: none; font-weight: 500;">Privacy</a>
        <a href="/contact.html" style="color: var(--color); text-decoration: none; font-weight: 500;">Contact</a>
    </nav>
    <div>© 2026 RollaWord</div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            query, 
            where, 
            orderBy, 
            limit, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC_ayepAzJV_vfV5Qh8m52tGnn1Iw7CRnY",
            authDomain: "laser-sailing-simulator.firebaseapp.com",
            projectId: "laser-sailing-simulator",
            storageBucket: "laser-sailing-simulator.firebasestorage.app",
            messagingSenderId: "45397375888",
            appId: "1:145397375888:web:1ca8d7688170787624d115"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Core State Engine: Tracks the date currently loaded on the screen
        let activeNavDate = new Date();

        // Helper routine: Formats any Date object into your required database tracking keys
        function formatQueryDate(targetDate) {
            const year = targetDate.getFullYear();
            const month = String(targetDate.getMonth() + 1).padStart(2, '0');
            const day = String(targetDate.getDate()).padStart(2, '0');
            return {
                key: `${year}${month}${day}`,
                display: `${year}-${month}-${day}`
            };
        }

        function getPlayerId() {
            try {
                return localStorage.getItem("rollaword.playerId");
            } catch (e) {
                return null;
            }
        }

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => (
                { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
            ));
        }

        async function renderLeaderboardView() {
            const dateData = formatQueryDate(activeNavDate);
            const todayData = formatQueryDate(new Date());
            
            const dateDisplay = document.getElementById("current-date-display");
            const wrapper = document.getElementById("leaderboard-table-wrapper");
            const prevBtn = document.getElementById("prev-date-btn");
            const nextBtn = document.getElementById("next-date-btn");
            
            if (dateDisplay) dateDisplay.textContent = dateData.display;
            if (!wrapper) return;

            // Handle the NEXT navigation lock instantly if active date catches back up to today
            if (nextBtn) {
                nextBtn.disabled = (dateData.key === todayData.key);
            }

            try {
                const leaderboardRef = collection(db, "rollaword_leaderboard");
                const q = query(
                    leaderboardRef, 
                    where("date", "==", dateData.key), 
                    orderBy("score", "desc"), 
                    limit(10)
                );
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    wrapper.innerHTML = `
                        <div style="text-align: center; padding: calc(var(--baseline) * 10); color: var(--gray);">
                            No submissions recorded yet for this day.<br>Be the first to secure a spot! 🏆
                        </div>`;
                    
                    // Disables PREV navigation button when moving into empty historical territory
                    if (prevBtn) prevBtn.disabled = true;
                    return;
                }

                // Keep historical navigation accessible as long as records load
                if (prevBtn) prevBtn.disabled = false;

                // Older entries have no playerId, so their document id stands in for it.
                const entries = querySnapshot.docs.map(d => {
                    const e = d.data();
                    return { name: String(e.name == null ? "" : e.name), score: e.score, id: e.playerId || ("doc-" + d.id) };
                });

                const myId = getPlayerId();
                let tableHtml = `<div style="display: flex; flex-direction: column; width: 100%;">`;
                let rank = 1;

                entries.forEach((entry) => {
                    const isMe = !!myId && entry.id === myId;
                    const you = isMe ? ` <span style="font-weight:700;">(you)</span>` : "";
                    tableHtml += `
                        <div class="leaderboard-row"${isMe ? ' style="background:#eef5fb;font-weight:700;"' : ""}>
                            <span class="rank-badge">#${rank}</span>
                            <span class="player-name">${escapeHtml(entry.name)}${you}</span>
                            <span class="player-score">${escapeHtml(entry.score)} pts</span>
                        </div>
                    `;
                    rank++;
                });

                tableHtml += `</div>`;
                wrapper.innerHTML = tableHtml;

            } catch (error) {
                console.error("Leaderboard component parsing exception:", error);
                wrapper.innerHTML = `
                    <div style="text-align: center; padding: calc(var(--baseline) * 10); color: var(--warning-color); font-variation-settings: 'wght' var(--font-weight-bold);">
                        Failed to synchronize daily standings.
                    </div>`;
            }
        }

        // Attach event listeners safely inside the script module structure
        document.getElementById("prev-date-btn").addEventListener("click", () => {
            activeNavDate.setDate(activeNavDate.getDate() - 1);
            renderLeaderboardView();
        });

        document.getElementById("next-date-btn").addEventListener("click", () => {
            activeNavDate.setDate(activeNavDate.getDate() + 1);
            renderLeaderboardView();
        });

        // Initial launch initialization
        renderLeaderboardView();
    </script>
</body>
</html>
