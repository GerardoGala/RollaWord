<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Comment Approval</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #1d2733;
    --muted: #6b7785;
    --line: #dde3ea;
    --accent: #1565c0;
    --good: #2e7d32;
    --bad: #c62828;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.45;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  header h1 { margin: 0; font-size: 1.25rem; }
  #who { font-size: .85rem; opacity: .9; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  [hidden] { display: none !important; }

  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button.secondary { background: #e3e8ee; color: var(--text); }
  button.good { background: var(--good); }
  button.bad { background: var(--bad); }
  button.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); padding: 8px 14px; font-size: .9rem; }

  .center { text-align: center; padding: 40px 12px; }
  .center p { color: var(--muted); }

  .tabs { display: flex; gap: 10px; margin-bottom: 14px; }
  .tabs button { flex: 1; }
  .tabs button:not(.active) { background: #e3e8ee; color: var(--text); }

  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--muted); font-size: .95rem; }

  .comment {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 6px; }
  .meta b { color: var(--text); font-size: 1rem; }
  .body { white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; margin: 8px 0 12px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions button { flex: 1; min-width: 120px; }

  #msg { background: #fff3cd; border: 1px solid #ffe08a; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
</style>
</head>
<body>

<header>
  <h1>Comment Approval</h1>
  <div>
    <span id="who"></span>
    <button class="ghost" id="btnOut" hidden>Sign out</button>
  </div>
</header>

<main>
  <div id="msg" hidden></div>

  <!-- Not signed in -->
  <section id="screenLogin" class="center" hidden>
    <p>Sign in to review reader comments.</p>
    <button id="btnGoogle">Login with your Google Account</button>
  </section>

  <!-- Signed in but not on the family list -->
  <section id="screenDenied" class="center" hidden>
    <p>This account (<span id="deniedEmail"></span>) is not allowed to approve comments.</p>
    <button class="secondary" id="btnOut2">Sign out and try another account</button>
  </section>

  <!-- Moderation -->
  <section id="screenMain" hidden>
    <div class="tabs">
      <button id="tabPending" class="active">Waiting <span id="count"></span></button>
      <button id="tabApproved">Approved</button>
    </div>
    <div class="bar">
      <span id="status"></span>
      <button class="secondary" id="btnRefresh">Refresh</button>
    </div>
    <div id="list"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== FILL THESE TWO IN (Supabase dashboard > Project Settings > API) ===== */
const SUPABASE_URL      = 'https://knuatcllwictmybubjys.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Inx5GNNrBFeNYbhIucwYnA_QWZQG5xq';
/* The anon key is meant to be public. Security comes from the database rules
   in blog-comments-setup.sql, not from hiding this page or the key. */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let view = 'pending';

function showScreen(name) {
  ['screenLogin', 'screenDenied', 'screenMain'].forEach(s => { $(s).hidden = (s !== name); });
  $('btnOut').hidden = (name === 'screenLogin');
}
function note(text) {
  const m = $('msg');
  m.textContent = text || '';
  m.hidden = !text;
}

async function init() {
  note('');
  const { data: { session } } = await sb.auth.getSession();
  if (!session || session.user.is_anonymous) { showScreen('screenLogin'); return; }

  const { data: ok, error } = await sb.rpc('is_moderator');
  if (error) { note('Could not check permission: ' + error.message); showScreen('screenLogin'); return; }
  if (!ok) {
    $('deniedEmail').textContent = session.user.email || 'unknown';
    showScreen('screenDenied');
    return;
  }
  $('who').textContent = session.user.email;
  showScreen('screenMain');
  load();
}

async function load() {
  note('');
  const wantApproved = (view === 'approved');
  $('tabPending').classList.toggle('active', !wantApproved);
  $('tabApproved').classList.toggle('active', wantApproved);
  $('status').textContent = 'Loading…';

  const { data, error } = await sb.from('comments')
    .select('*')
    .eq('approved', wantApproved)
    .order('created_at', { ascending: wantApproved ? false : true });
  if (error) { $('status').textContent = ''; note('Error: ' + error.message); return; }

  const { count } = await sb.from('comments')
    .select('id', { count: 'exact', head: true }).eq('approved', false);
  $('count').textContent = count ? '(' + count + ')' : '';

  $('status').textContent = data.length + (wantApproved ? ' approved' : ' waiting');
  render(data, wantApproved);
}

function render(rows, isApproved) {
  const list = $('list');
  list.textContent = '';
  if (!rows.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = isApproved ? 'No approved comments yet.' : 'Nothing waiting. All caught up.';
    list.appendChild(e);
    return;
  }
  rows.forEach(c => {
    const card = document.createElement('div');
    card.className = 'comment';

    const meta = document.createElement('div');
    meta.className = 'meta';
    const who = document.createElement('b');
    who.textContent = c.author_name;           // textContent: comment text can never run as code
    meta.appendChild(who);
    meta.appendChild(document.createTextNode(
      '  ·  ' + new Date(c.created_at).toLocaleString() + '  ·  post: ' + c.post_slug));

    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = c.body;

    const actions = document.createElement('div');
    actions.className = 'actions';
    if (isApproved) {
      actions.appendChild(mkBtn('Hide again', 'secondary', () => setApproved(c.id, false)));
    } else {
      actions.appendChild(mkBtn('Approve', 'good', () => setApproved(c.id, true)));
    }
    actions.appendChild(mkBtn('Delete', 'bad', () => del(c.id)));

    card.append(meta, body, actions);
    list.appendChild(card);
  });
}

function mkBtn(label, cls, fn) {
  const b = document.createElement('button');
  b.textContent = label;
  b.className = cls;
  b.addEventListener('click', fn);
  return b;
}

async function setApproved(id, val) {
  const { error } = await sb.from('comments').update({ approved: val }).eq('id', id);
  if (error) { note('Error: ' + error.message); return; }
  load();
}
async function del(id) {
  if (!confirm('Delete this comment permanently?')) return;
  const { error } = await sb.from('comments').delete().eq('id', id);
  if (error) { note('Error: ' + error.message); return; }
  load();
}

async function signIn() {
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: location.origin + location.pathname }
  });
  if (error) note('Sign-in error: ' + error.message);
}
async function signOut() {
  await sb.auth.signOut();
  $('who').textContent = '';
  showScreen('screenLogin');
}

$('btnGoogle').addEventListener('click', signIn);
$('btnOut').addEventListener('click', signOut);
$('btnOut2').addEventListener('click', signOut);
$('btnRefresh').addEventListener('click', load);
$('tabPending').addEventListener('click', () => { view = 'pending'; load(); });
$('tabApproved').addEventListener('click', () => { view = 'approved'; load(); });

init();
</script>
</body>
</html>
