<!doctype html>
<!-- Bible Family Tree, version listen4: Listen reads one verse. If you can find "toggleListen" in this file, it is the newest. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bible Family Tree</title>
<meta name="description" content="RollaWordBible Family Tree is a free app that documents the geneology of the people in the KJV bible.">
<link rel="stylesheet" href="/bible/bible.css?v=listen4">
</head>
<body>

<div id="app">
  <main id="tree" aria-label="Family tree, one coloured band per generation">
    <div id="status">Loading the family tree...</div>
    <div id="sentinel"></div>
  </main>

  <section id="reader">
    <div id="who" aria-live="polite">
      <div class="top">
        <button class="step" id="prev" aria-label="Previous person" disabled>&#9664;</button>
        <h1 id="whoName">Tap a person</h1>
        <button class="step" id="next" aria-label="Next person" disabled>&#9654;</button>
      </div>
      <div class="meta" id="whoMeta"></div>
      <div class="meta" id="whoAbout" hidden></div>
      <div class="chips" id="family"></div>
      <div class="chips" id="verses"></div>
    </div>
    <div id="text"><p class="note">Tap any person on the left to read where the Bible mentions them.</p></div>

    <div id="credit">
      <div id="bar">
        <button type="button" class="switch" id="trace" role="switch" aria-checked="true"
                title="On: only people who can be traced back to Adam and Eve. Off: everyone, including families that cannot be traced.">
          <span class="track" aria-hidden="true"></span><span class="lab">Traceable</span><span class="state" id="traceState">On</span>
        </button>
        <input id="search" type="search" placeholder="Find a person" aria-label="Find a person by name"
               autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <a class="creditsBtn" id="creditsBtn" href="/bible/about.html" target="_blank" rel="noopener" aria-label="About this app and credits">
          <span aria-hidden="true">&#9432;</span><span class="txt"> About</span>
        </a>
      </div>
      <div id="results" role="list" hidden></div>
    </div>
  </section>
</div>

<div id="rotate"><div class="big" aria-hidden="true">&#8635;</div><div>Please turn your phone sideways.<br>This page shows the family tree and the Bible text side by side.</div>
  <button type="button" id="uprightBtn">Use it upright anyway</button></div>

<noscript>This page needs JavaScript.</noscript>

<script>
// ------------------------------------------------------------------
// Settings you can change
// ------------------------------------------------------------------
const TREE_FILE = 'family_tree.json';
const TEXT_FILE = 'kjv_chapters.json';
const FOLDERS = ['/bible/', 'bible/', ''];   // places to look for the two files above
const HUE_STEP = 47;                          // how far the colour moves from one generation to the next
const LOAD_AHEAD = 400;                       // load the next section when it is this many pixels from view
const MAX_RESULTS = 15;                       // search results shown at once
const STORAGE_KEY = 'bibletree.traceable';    // remembers the Traceable switch on this phone

// <pure>
const ALONE_CHUNK = 45;                       // people per section in the "no family recorded" list

// Turns a start list into generations: bands -> groups of children -> people.
// placeOf(id) says under which parent a person sits (or null); skip(id) leaves someone out.
function buildLevels(P, start, placeOf, startTitle, skip) {
  const bands = [{ gen: 0, groups: [{ parent: null, title: startTitle, members: start.slice() }] }];
  const flat = start.slice();
  const placed = {};
  start.forEach(function (id) { placed[id] = true; });
  for (let g = 0; ; g++) {
    const groups = [];
    bands[g].groups.forEach(function (grp) {
      grp.members.forEach(function (pid) {
        const kids = P[pid].children.filter(function (c) {
          return P[c] && !placed[c] && placeOf(c) === pid && !(skip && skip(c));
        });
        if (!kids.length) return;
        const mothers = [];
        kids.forEach(function (c) {
          placed[c] = true;
          const m = P[c].mother;
          if (m && mothers.indexOf(m) === -1) mothers.push(m);
        });
        let title = 'Children of ' + P[pid].name;
        if (mothers.length === 1 && P[mothers[0]] && P[pid].father !== mothers[0] && mothers[0] !== pid) {
          title += ' & ' + P[mothers[0]].name;
        }
        groups.push({ parent: pid, title: title, members: kids, showMothers: mothers.length > 1 });
        kids.forEach(function (c) { flat.push(c); });
      });
    });
    if (!groups.length) break;
    bands.push({ gen: g + 1, groups: groups });
  }
  return { bands: bands, flat: flat };
}

// Builds every section of the left pane, in order:
//   1. one section per generation of the tree that starts with Adam and Eve (the traced tree)
//   2. one section per family that the data cannot link to Adam and Eve
//   3. the people with no relatives recorded, in alphabetical chunks
function buildModel(data) {
  const P = data.people;
  const start = data.start;

  // who descends from the start people, and under which parent each of them sits
  const depthMemo = {};
  const keyMemo = {};
  function depth(id) {
    if (id in depthMemo) return depthMemo[id];
    depthMemo[id] = null;                       // guards against loops
    let d = null, key = null;
    if (start.indexOf(id) !== -1) d = 0;
    else {
      const parents = [P[id].father, P[id].mother];
      for (let i = 0; i < parents.length; i++) {
        const k = parents[i];
        if (k && P[k]) {
          const kd = depth(k);
          if (kd !== null) { d = kd + 1; key = k; break; }
        }
      }
    }
    depthMemo[id] = d;
    keyMemo[id] = key;
    return d;
  }
  const inTraced = function (id) { return depth(id) !== null; };
  const tracedKey = function (id) { depth(id); return keyMemo[id] || null; };
  const looseKey = function (id) {
    const p = P[id];
    if (p.father && P[p.father]) return p.father;
    if (p.mother && P[p.mother]) return p.mother;
    return null;
  };

  const m = { sections: [], sectionOf: {}, genOf: {}, famOf: {}, flat: [], dupNames: {} };
  function mark(band, sectionIndex, genIndex, root) {
    band.groups.forEach(function (g) {
      g.members.forEach(function (id) {
        m.sectionOf[id] = sectionIndex;
        m.genOf[id] = genIndex;
        if (root) m.famOf[id] = root;
      });
    });
  }

  const traced = buildLevels(P, start, tracedKey, 'The first couple', null);
  traced.bands.forEach(function (band, i) {
    m.sections.push({ kind: 'band', band: band, hue: i, label: 'Generation ' + (i + 1) });
    mark(band, m.sections.length - 1, i, null);
  });
  traced.flat.forEach(function (id) { m.flat.push(id); });
  m.tracedSections = m.sections.length;
  m.tracedFlat = m.flat.length;

  (data.families || []).forEach(function (root) {
    if (!P[root] || inTraced(root)) return;
    const f = buildLevels(P, [root], looseKey, 'Head of this family', inTraced);
    const s = { kind: 'family', root: root, bands: f.bands, count: f.flat.length };
    if (!m.sections.some(function (x) { return x.kind === 'family'; })) s.banner = 'families';
    m.sections.push(s);
    f.bands.forEach(function (band, i) { mark(band, m.sections.length - 1, i, root); });
    f.flat.forEach(function (id) { m.flat.push(id); });
  });

  const alone = (data.alone || []).filter(function (id) { return P[id] && m.sectionOf[id] === undefined; });
  for (let i = 0; i < alone.length; i += ALONE_CHUNK) {
    const members = alone.slice(i, i + ALONE_CHUNK);
    const s = {
      kind: 'alone', members: members, hue: 3,
      title: P[members[0]].name + ' – ' + P[members[members.length - 1]].name
    };
    if (i === 0) s.banner = 'alone';
    m.sections.push(s);
    members.forEach(function (id) { m.sectionOf[id] = m.sections.length - 1; m.flat.push(id); });
  }

  m.flat.forEach(function (id) {
    const n = P[id].name;
    m.dupNames[n] = (m.dupNames[n] || 0) + 1;
  });
  return m;
}

// "Gen.5.3" -> { book: 'Gen', chapter: '5', verse: '3' }
function parseRef(ref) {
  const a = ref.split('.');
  return { book: a[0], chapter: a[1], verse: a[2] };
}
// </pure>

const BOOKS = {
  Gen: 'Genesis', Exod: 'Exodus', Lev: 'Leviticus', Num: 'Numbers', Deut: 'Deuteronomy', Josh: 'Joshua',
  Judg: 'Judges', Ruth: 'Ruth', '1Sam': '1 Samuel', '2Sam': '2 Samuel', '1Kgs': '1 Kings', '2Kgs': '2 Kings',
  '1Chr': '1 Chronicles', '2Chr': '2 Chronicles', Ezra: 'Ezra', Neh: 'Nehemiah', Esth: 'Esther', Job: 'Job',
  Ps: 'Psalms', Prov: 'Proverbs', Eccl: 'Ecclesiastes', Song: 'Song of Solomon', Isa: 'Isaiah', Jer: 'Jeremiah',
  Lam: 'Lamentations', Ezek: 'Ezekiel', Dan: 'Daniel', Hos: 'Hosea', Joel: 'Joel', Amos: 'Amos', Obad: 'Obadiah',
  Jonah: 'Jonah', Mic: 'Micah', Nah: 'Nahum', Hab: 'Habakkuk', Zeph: 'Zephaniah', Hag: 'Haggai', Zech: 'Zechariah',
  Mal: 'Malachi', Matt: 'Matthew', Mark: 'Mark', Luke: 'Luke', John: 'John', Acts: 'Acts', Rom: 'Romans',
  '1Cor': '1 Corinthians', '2Cor': '2 Corinthians', Gal: 'Galatians', Eph: 'Ephesians', Phil: 'Philippians',
  Col: 'Colossians', '1Thess': '1 Thessalonians', '2Thess': '2 Thessalonians', '1Tim': '1 Timothy',
  '2Tim': '2 Timothy', Titus: 'Titus', Phlm: 'Philemon', Heb: 'Hebrews', Jas: 'James', '1Pet': '1 Peter',
  '2Pet': '2 Peter', '1John': '1 John', '2John': '2 John', '3John': '3 John', Jude: 'Jude', Rev: 'Revelation'
};
function niceRef(ref) {
  const r = parseRef(ref);
  return (BOOKS[r.book] || r.book) + ' ' + r.chapter + ':' + r.verse;
}

const ICON_M = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3.7" fill="currentColor"/><path d="M6.5 21v-6.3C6.5 12.4 8 11 10 11h4c2 0 3.5 1.4 3.5 3.7V21z" fill="currentColor"/></svg>';
const ICON_F = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3.7" fill="currentColor"/><path d="M12 10.6c-2.3 0-3.7 1.5-4.3 3.9L5.2 21.5h13.6l-2.5-7c-.6-2.400-2-3.900-4.300-3.900z" fill="currentColor"/></svg>';
const ICON_N = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="9" r="2.6" fill="currentColor"/><circle cx="17.5" cy="9" r="2.6" fill="currentColor"/><circle cx="12" cy="6" r="3" fill="currentColor"/><path d="M2.5 20v-4c0-1.600 1.100-2.800 2.800-2.800h2.400c.8 0 1.500.3 2 .7-.9 1-1.400 2.200-1.400 3.700V20zM21.500 20v-4c0-1.600-1.100-2.800-2.800-2.800h-2.400c-.8 0-1.500.3-2 .7.9 1 1.400 2.200 1.400 3.700V20zM8.500 20v-3.800c0-1.900 1.400-3.200 3.500-3.200s3.500 1.300 3.500 3.200V20z" fill="currentColor"/></svg>';

const treeEl = document.getElementById('tree');
const statusEl = document.getElementById('status');
const sentinel = document.getElementById('sentinel');
const textEl = document.getElementById('text');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const readerEl = document.getElementById('reader');
const barEl = document.getElementById('bar');
const traceBtn = document.getElementById('trace');
const traceState = document.getElementById('traceState');
const searchEl = document.getElementById('search');
const resultsEl = document.getElementById('results');
const creditsBtn = document.getElementById('creditsBtn');

let data = null, model = null, chapters = null;
let nextSection = 0;
let current = null;           // id of the selected person
let activeRef = null;         // verse shown in the text pane
let flatIndex = {};
let scopeOn = true;           // the Traceable switch
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let workingFolder = null;
async function fetchJson(name) {
  const tryFolders = workingFolder === null ? FOLDERS : [workingFolder];
  let lastError = null;
  for (const folder of tryFolders) {
    try {
      const response = await fetch(folder + name);
      if (response.ok) {
        const result = await response.json();
        workingFolder = folder;
        return result;
      }
      lastError = new Error(folder + name + ' (' + response.status + ')');
    } catch (e) { lastError = e; }
  }
  throw lastError;
}

function sectionLimit() { return scopeOn ? model.tracedSections : model.sections.length; }
function flatLimit() { return scopeOn ? model.tracedFlat : model.flat.length; }
function isShown(id) { return typeof model.sectionOf[id] === 'number' && model.sectionOf[id] < sectionLimit(); }

function relation(id) {
  const p = data.people[id];
  const parent = p.father && data.people[p.father] ? p.father : (p.mother && data.people[p.mother] ? p.mother : null);
  if (!parent) return '';
  return (p.sex === 'F' ? 'daughter of ' : 'son of ') + data.people[parent].name;
}

// ------------------------------------------------------------------
// The left pane: sections that load as you scroll
// ------------------------------------------------------------------
function makeTile(id, group, genNumber, inFamily) {
  const p = data.people[id];
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'tile' + (p.mainLine ? ' main' : '') + (p.kind === 'nation' ? ' nation' : '');
  tile.dataset.id = id;
  tile.setAttribute('aria-pressed', 'false');
  tile.setAttribute('aria-label', p.name + (p.kind === 'nation' ? ', a nation' : p.sex === 'F' ? ', woman' : ', man') +
    (genNumber ? ', generation ' + genNumber + (inFamily ? ' of this family' : '') : '') + (p.mainLine ? ', main line' : ''));
  tile.innerHTML = (p.kind === 'nation' ? ICON_N : p.sex === 'F' ? ICON_F : ICON_M);

  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = p.name;
  tile.appendChild(name);

  let sub = '';
  if (p.kind === 'nation') sub = 'nation';
  else if (group && group.showMothers && p.mother && data.people[p.mother]) sub = data.people[p.mother].name;
  else if (model.dupNames[p.name] > 1) sub = p.note || relation(id) || (p.verses.length ? niceRef(p.verses[0]) : '');
  if (sub) {
    const s = document.createElement('span');
    s.className = 'sub';
    s.textContent = sub;
    tile.appendChild(s);
  }
  tile.addEventListener('click', function () { selectPerson(id); });
  return tile;
}

function bandEl(band, hueIndex, label, inFamily) {
  const section = document.createElement('section');
  section.className = 'band';
  section.dataset.alt = String(hueIndex % 2);   // two blues, used turn and turn about
  const h2 = document.createElement('h2');
  h2.textContent = label;
  section.appendChild(h2);
  band.groups.forEach(function (group) {
    const wrap = document.createElement('div');
    wrap.className = 'group';
    if (group.title) {
      const h3 = document.createElement('h3');
      h3.textContent = group.title + (group.members.length > 1 ? ' (' + group.members.length + ')' : '');
      wrap.appendChild(h3);
    }
    const grid = document.createElement('div');
    grid.className = 'grid';
    group.members.forEach(function (id) { grid.appendChild(makeTile(id, group, hueIndex + 1, inFamily)); });
    wrap.appendChild(grid);
    section.appendChild(wrap);
  });
  return section;
}

function bannerEl(kind) {
  const b = document.createElement('div');
  b.className = 'banner';
  const h = document.createElement('h2');
  const p = document.createElement('p');
  if (kind === 'families') {
    h.textContent = 'Families not traced to Adam and Eve';
    p.textContent = 'The Bible names these people and their families, but the lists this tree uses do not connect them to Adam and Eve. Each family stands on its own, in Bible order.';
  } else {
    h.textContent = 'No family recorded';
    p.textContent = 'These people are named in the Bible, but no parents or children are recorded for them here. In alphabetical order.';
  }
  b.appendChild(h);
  b.appendChild(p);
  return b;
}

function renderSection(index) {
  const s = model.sections[index];
  const wrap = document.createElement('div');
  wrap.dataset.section = String(index);
  if (s.banner) wrap.appendChild(bannerEl(s.banner));
  if (s.kind === 'band') {
    wrap.appendChild(bandEl(s.band, s.hue, s.label, false));
  } else if (s.kind === 'family') {
    const h = document.createElement('h2');
    h.className = 'famhead';
    h.textContent = 'Family of ' + data.people[s.root].name + ' · ' + s.count + (s.count === 1 ? ' person' : ' people');
    wrap.appendChild(h);
    s.bands.forEach(function (band, i) {
      wrap.appendChild(bandEl(band, i, 'Generation ' + (i + 1) + ' of this family', true));
    });
  } else {
    const band = { groups: [{ parent: null, title: s.title, members: s.members }] };
    wrap.appendChild(bandEl(band, s.hue, 'No family recorded', true));
  }
  treeEl.insertBefore(wrap, sentinel);
}

function renderUpTo(index) {
  while (nextSection <= index && nextSection < sectionLimit()) renderSection(nextSection++);
  updateStatus();
}

function fillScreen() {
  // keep adding sections while the end of the list is close to the bottom of the screen
  while (nextSection < sectionLimit() &&
         sentinel.getBoundingClientRect().top < treeEl.getBoundingClientRect().bottom + LOAD_AHEAD) {
    renderSection(nextSection++);
  }
  updateStatus();
}

function updateStatus() {
  if (nextSection >= sectionLimit()) {
    statusEl.textContent = scopeOn
      ? 'That is the end of the traced tree (' + model.tracedFlat + ' people). Turn the Traceable switch off to add the families that cannot be traced to Adam and Eve.'
      : 'That is everyone in the list (' + model.flat.length + ' people).';
    treeEl.appendChild(statusEl);
  } else {
    statusEl.textContent = '';
    if (statusEl.parentNode) statusEl.remove();
  }
}

// ------------------------------------------------------------------
// The right pane: who it is, and the Bible text
// ------------------------------------------------------------------
function yearText(y) { return y < 0 ? Math.abs(y) + ' BC' : y + ' AD'; }

function chip(label, onClick, isCurrent) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.textContent = label;
  if (isCurrent) b.setAttribute('aria-current', 'true');
  b.addEventListener('click', onClick);
  return b;
}

function showWho(id) {
  const p = data.people[id];
  const h1 = document.getElementById('whoName');
  h1.textContent = p.name;
  if (p.note) {
    const small = document.createElement('small');
    small.textContent = ' (' + p.note + ')';
    h1.appendChild(small);
  }
  const bits = [];
  if (p.kind === 'nation') bits.push('a nation, not one person');
  else bits.push(p.sex === 'F' ? 'woman' : 'man');
  if (p.alt && p.alt.length) bits.push('also called ' + p.alt.join(', '));
  if (typeof p.birthYear === 'number') bits.push('born about ' + yearText(p.birthYear));
  if (typeof p.deathYear === 'number') bits.push('died about ' + yearText(p.deathYear));
  const g = model.genOf[id];
  if (typeof g === 'number') {
    const fam = model.famOf[id];
    bits.push(fam ? 'generation ' + (g + 1) + ' of the family of ' + data.people[fam].name : 'generation ' + (g + 1));
  }
  if (p.untraced) bits.push('not traced to Adam and Eve');
  else if (p.linkVerse) bits.push('parent link read from ' + niceRef(p.linkVerse));
  else if (!p.mainLine) bits.push('link not yet checked');
  if (typeof model.sectionOf[id] === 'number' && !isShown(id)) bits.push('hidden in the tree while Traceable is on');
  document.getElementById('whoMeta').textContent = bits.join(' · ');

  const about = document.getElementById('whoAbout');
  about.textContent = p.about || '';
  about.hidden = !p.about;

  const fam = document.getElementById('family');
  fam.textContent = '';
  const addRel = function (label, ids) {
    const list = ids.filter(function (x) { return x && data.people[x]; });
    if (!list.length) return;
    const l = document.createElement('span');
    l.className = 'lbl';
    l.textContent = label;
    fam.appendChild(l);
    list.forEach(function (x) { fam.appendChild(chip(data.people[x].name, function () { selectPerson(x); })); });
  };
  addRel('Father', [p.father]);
  addRel('Mother', [p.mother]);
  addRel('Children', p.children);

  const vs = document.getElementById('verses');
  vs.textContent = '';
  if (p.verses.length) {
    const l = document.createElement('span');
    l.className = 'lbl';
    l.textContent = 'Verses';
    vs.appendChild(l);
    p.verses.forEach(function (ref) {
      // the button for the verse on screen reads it aloud; any other button shows that verse
      vs.appendChild(chip(niceRef(ref), function () {
        if (ref === activeRef && listenCtx && canSpeak) toggleListen(); else showVerse(ref);
      }, ref === activeRef));
    });
  }
  updateStepButtons(id);
}

function updateStepButtons(id) {
  const i = flatIndex[id];
  const known = typeof i === 'number' && i < flatLimit();
  prevBtn.disabled = !(known && i > 0);
  nextBtn.disabled = !(known && i < flatLimit() - 1);
}

async function showVerse(ref) {
  stopListening();
  activeRef = ref;
  document.querySelectorAll('#verses .chip').forEach(function (c) {
    c.removeAttribute('aria-current');
    if (c.textContent === niceRef(ref)) c.setAttribute('aria-current', 'true');
  });
  const r = parseRef(ref);
  textEl.innerHTML = '<p class="note">Loading the text...</p>';
  try {
    if (!chapters) chapters = await chaptersPromise;
  } catch (e) {
    textEl.innerHTML = '<p class="note">The Bible text file (' + TEXT_FILE + ') could not be loaded.</p>';
    return;
  }
  if (activeRef !== ref) return;                       // the person tapped something else meanwhile
  const chapter = chapters[r.book + '.' + r.chapter];
  if (!chapter) {
    textEl.innerHTML = '<p class="note">This chapter is not in the text file.</p>';
    return;
  }
  textEl.textContent = '';
  const h2 = document.createElement('h2');
  h2.textContent = (BOOKS[r.book] || r.book) + ' ' + r.chapter + ' (King James Version)';
  textEl.appendChild(h2);
  const nums = Object.keys(chapter).map(Number).sort(function (a, b) { return a - b; });
  let target = null;
  nums.forEach(function (n) {
    const p = document.createElement('p');
    p.className = 'v';
    const sup = document.createElement('sup');
    sup.textContent = n;
    p.appendChild(sup);
    p.appendChild(document.createTextNode(chapter[String(n)]));
    if (String(n) === r.verse) { p.classList.add('hit'); target = p; }
    textEl.appendChild(p);
  });
  listenCtx = target ? { text: chapter[r.verse] } : null;
  if (target && canSpeak) {
    const num = target.querySelector('sup');
    num.className = 'listen';
    num.setAttribute('role', 'button');
    num.tabIndex = 0;
    num.title = 'Listen to this verse';
    num.addEventListener('click', toggleListen);
    num.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleListen(); } });
  }
  if (target) target.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
  else textEl.scrollTop = 0;
}

// ------------------------------------------------------------------
// Listen: tap the verse number, or the highlighted verse button at the top, and the phone's own voice
// reads that one verse aloud
// ------------------------------------------------------------------
const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let listenCtx = null;          // the verse on screen: { text }
let listenRun = 0;             // changes whenever reading starts or stops, so an old reading cannot carry on
let listenOn = false;

function setListenIcon(on) {
  listenOn = on;
  document.documentElement.classList.toggle('listening', on);   // the CSS swaps the ▶ for a ■
}

function stopListening() {
  listenRun++;
  if (canSpeak) { try { speechSynthesis.cancel(); } catch (e) { /* nothing is playing */ } }
  setListenIcon(false);
}

function pickVoice() {
  const all = speechSynthesis.getVoices().filter(function (v) { return /^en/i.test(v.lang); });
  return all.find(function (v) { return /en[-_]GB/i.test(v.lang); }) || all[0] || null;
}

function toggleListen() {
  if (!canSpeak || !listenCtx) return;
  if (listenOn) { stopListening(); return; }
  const run = ++listenRun;
  speechSynthesis.cancel();
  setListenIcon(true);
  const voice = pickVoice();
  const u = new SpeechSynthesisUtterance(listenCtx.text);
  u.lang = voice ? voice.lang : 'en-GB';
  if (voice) u.voice = voice;
  u.rate = 0.95;
  u.onend = u.onerror = function () { if (run === listenRun) setListenIcon(false); };
  speechSynthesis.speak(u);
}
window.addEventListener('pagehide', stopListening);

function selectPerson(id) {
  if (!data.people[id]) return;
  stopListening();
  current = id;
  if (isShown(id)) renderUpTo(model.sectionOf[id]);
  document.querySelectorAll('.tile[aria-pressed="true"]').forEach(function (t) { t.setAttribute('aria-pressed', 'false'); });
  const tile = treeEl.querySelector('.tile[data-id="' + id + '"]');
  if (tile) {
    tile.setAttribute('aria-pressed', 'true');
    tile.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  const p = data.people[id];
  activeRef = p.verses[0] || null;
  showWho(id);
  if (activeRef) showVerse(activeRef);
  else textEl.innerHTML = '<p class="note">No verse is listed for this person.</p>';
}

function step(delta) {
  const i = flatIndex[current];
  if (typeof i !== 'number') return;
  const j = i + delta;
  if (j >= 0 && j < flatLimit()) selectPerson(model.flat[j]);
}
prevBtn.addEventListener('click', function () { step(-1); });
nextBtn.addEventListener('click', function () { step(1); });

function setScope(on) {
  scopeOn = on;
  try { localStorage.setItem(STORAGE_KEY, on ? 'on' : 'off'); } catch (e) { /* the switch still works without it */ }
  traceBtn.setAttribute('aria-checked', on ? 'true' : 'false');
  traceState.textContent = on ? 'On' : 'Off';
  if (on) {
    // take away the sections that are not part of the traced tree
    treeEl.querySelectorAll('[data-section]').forEach(function (el) {
      if (Number(el.dataset.section) >= model.tracedSections) el.remove();
    });
    nextSection = Math.min(nextSection, model.tracedSections);
  }
  fillScreen();
  if (current) {
    const tile = treeEl.querySelector('.tile[data-id="' + current + '"]');
    if (tile) tile.setAttribute('aria-pressed', 'true');
    showWho(current);
  }
  renderResults();
}
traceBtn.addEventListener('click', function () { setScope(!scopeOn); });

// ----- search -----
function describe(id) {
  const p = data.people[id];
  const bits = [];
  const note = p.note || relation(id);
  if (note) bits.push(note);
  const q = searchEl.value.trim().toLowerCase();
  const a = q && p.name.toLowerCase().indexOf(q) === -1 ? altMatch(p, q) : null;
  if (a) bits.push('also called ' + a);
  if (p.verses.length) bits.push(niceRef(p.verses[0]));
  return bits.join(' · ');
}

// the other names the dataset records for a person (Enosh for Enos, Timothy for Timotheus)
function altMatch(p, q) {
  if (!p.alt) return null;
  for (let i = 0; i < p.alt.length; i++) {
    if (p.alt[i].toLowerCase().indexOf(q) !== -1) return p.alt[i];
  }
  return null;
}

function searchPeople(query, ignoreScope) {
  const q = query.toLowerCase();
  const hits = [];
  Object.keys(data.people).forEach(function (id) {
    const p = data.people[id];
    if (scopeOn && !ignoreScope && p.untraced) return;
    const name = p.name.toLowerCase();
    let score = -1;
    if (name === q) score = 0;
    else if (name.indexOf(q) === 0) score = 1;
    else if (name.indexOf(q) > 0) score = 2;
    else if (p.note && p.note.toLowerCase().indexOf(q) !== -1) score = 3;
    else if (altMatch(p, q)) score = 4;          // another spelling or name, such as Timothy for Timotheus
    if (score < 0) return;
    hits.push({ id: id, score: score, main: p.mainLine ? 0 : 1, order: typeof flatIndex[id] === 'number' ? flatIndex[id] : 1e9 });
  });
  hits.sort(function (a, b) { return a.score - b.score || a.main - b.main || a.order - b.order; });
  return hits;
}

function closePanels() {
  resultsEl.hidden = true;
}

function renderResults() {
  const q = searchEl.value.trim();
  resultsEl.textContent = '';
  if (!q || !data) { resultsEl.hidden = true; return; }
  const hits = searchPeople(q);
  resultsEl.hidden = false;
  if (!hits.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    const hidden = scopeOn ? searchPeople(q, true).length : 0;
    e.textContent = hidden
      ? (hidden === 1 ? 'Found 1 person who is not traced to Adam and Eve.' : 'Found ' + hidden + ' people who are not traced to Adam and Eve.') + ' Turn Traceable off to see ' + 'them.'
      : 'No one found.';
    resultsEl.appendChild(e);
    return;
  }
  hits.slice(0, MAX_RESULTS).forEach(function (h) {
    const p = data.people[h.id];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'res';
    b.dataset.id = h.id;
    const rn = document.createElement('span');
    rn.className = 'rn';
    rn.textContent = p.name;
    if (p.untraced) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'not traced';
      rn.appendChild(tag);
    }
    const rd = document.createElement('span');
    rd.className = 'rd';
    rd.textContent = describe(h.id);
    b.appendChild(rn);
    b.appendChild(rd);
    b.addEventListener('click', function () { chooseResult(h.id); });
    resultsEl.appendChild(b);
  });
  if (hits.length > MAX_RESULTS) {
    const more = document.createElement('div');
    more.className = 'empty';
    more.textContent = (hits.length - MAX_RESULTS) + ' more. Type more letters to narrow it down.';
    resultsEl.appendChild(more);
  }
}

function chooseResult(id) {
  searchEl.value = '';
  closePanels();
  searchEl.blur();
  selectPerson(id);
}

searchEl.addEventListener('input', renderResults);
searchEl.addEventListener('keydown', function (e) {
  const buttons = resultsEl.querySelectorAll('.res');
  if (e.key === 'Enter' && buttons.length) { e.preventDefault(); chooseResult(buttons[0].dataset.id); }
  else if (e.key === 'ArrowDown' && buttons.length) { e.preventDefault(); buttons[0].focus(); }
  else if (e.key === 'Escape') { searchEl.value = ''; closePanels(); }
});
resultsEl.addEventListener('keydown', function (e) {
  const buttons = Array.prototype.slice.call(resultsEl.querySelectorAll('.res'));
  const i = buttons.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' && i < buttons.length - 1) { e.preventDefault(); buttons[i + 1].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); (i > 0 ? buttons[i - 1] : searchEl).focus(); }
  else if (e.key === 'Escape') { e.preventDefault(); searchEl.focus(); closePanels(); }
});

document.addEventListener('pointerdown', function (e) {
  if (!document.getElementById('credit').contains(e.target)) closePanels();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') closePanels();
});

// A phone with rotation locked cannot turn sideways, so it can stack the two panes instead.
document.getElementById('uprightBtn').addEventListener('click', function () {
  document.documentElement.classList.add('upright');
  window.dispatchEvent(new Event('resize'));
});

// ------------------------------------------------------------------
// Start
// ------------------------------------------------------------------
let chaptersPromise = null;
(async function init() {
  try {
    data = await fetchJson(TREE_FILE);
  } catch (e) {
    statusEl.textContent = 'Could not load ' + TREE_FILE + '. Put it in the same folder as this page (or in a folder called bible).';
    return;
  }
  chaptersPromise = fetchJson(TEXT_FILE);
  chaptersPromise.catch(function () {});               // an error is reported when a verse is shown

  model = buildModel(data);
  model.flat.forEach(function (id, i) { flatIndex[id] = i; });

  try { if (localStorage.getItem(STORAGE_KEY) === 'off') scopeOn = false; } catch (e) { /* use the default */ }
  traceBtn.setAttribute('aria-checked', scopeOn ? 'true' : 'false');
  traceState.textContent = scopeOn ? 'On' : 'Off';

  treeEl.addEventListener('scroll', fillScreen, { passive: true });
  window.addEventListener('resize', fillScreen);
  renderSection(nextSection++);
  fillScreen();
  selectPerson(data.start[0]);
})();
</script>
